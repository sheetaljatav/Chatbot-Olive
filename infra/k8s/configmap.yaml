apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: chatbot
data:
  PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-2.5-flash"
  EVENT_STREAM: "llm.events"
  EVENT_DLQ: "llm.events.dlq"
  EVENT_GROUP: "workers"
  CONTEXT_TURN_LIMIT: "12"
  PII_REDACTION_ENABLED: "true"
  PII_ENTITIES: "EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD,US_SSN,IP_ADDRESS"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://chatbot:chatbot@postgres:5432/chatbot"
  INGESTION_URL: "http://ingestion-api:8001"
  CORS_ORIGINS: "*"
