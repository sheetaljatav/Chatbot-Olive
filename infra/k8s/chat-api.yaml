apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: chatbot
spec:
  replicas: 2
  selector:
    matchLabels: { app: chat-api }
  template:
    metadata:
      labels: { app: chat-api }
    spec:
      containers:
        - name: chat-api
          image: chatbot/chat-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: chatbot-config }
            - secretRef: { name: chatbot-secrets }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: chatbot
spec:
  selector: { app: chat-api }
  ports:
    - port: 8000
      targetPort: 8000
