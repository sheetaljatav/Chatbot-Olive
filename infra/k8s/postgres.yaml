apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: chatbot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: chatbot
data:
  init.sql: |
    -- (Placeholder: in a real deploy, mount the contents of infra/postgres/init.sql
    -- here, or use a kustomize configMapGenerator. Keeping it short in the
    -- example manifest; see README for the kustomize-based setup.)
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: chatbot
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: chatbot
            - name: POSTGRES_DB
              value: chatbot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: chatbot-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "chatbot"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initsql, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: initsql
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chatbot
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
