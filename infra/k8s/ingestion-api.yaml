apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: chatbot
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion-api }
  template:
    metadata:
      labels: { app: ingestion-api }
    spec:
      containers:
        - name: ingestion-api
          image: chatbot/ingestion-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: chatbot-config }
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: chatbot
spec:
  selector: { app: ingestion-api }
  ports:
    - port: 8001
      targetPort: 8001
