apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chatbot

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - ingestion-api.yaml
  - worker.yaml
  - chat-api.yaml
  - web.yaml
  - ingress.yaml

# Use configMapGenerator to embed the full schema. Apply via
#   kubectl apply -k infra/k8s
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql=../postgres/init.sql

generatorOptions:
  disableNameSuffixHash: true
