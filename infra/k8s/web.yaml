apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chatbot
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: chatbot/web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_CHAT_API_URL
              value: "/api"
            - name: CHAT_API_URL
              value: "http://chat-api:8000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chatbot
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
