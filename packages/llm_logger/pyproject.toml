[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_logger"
version = "0.1.0"
description = "Lightweight SDK that captures LLM inference metadata and ships it to an ingestion endpoint."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
gemini    = ["google-generativeai>=0.7"]
openai    = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_logger*"]
